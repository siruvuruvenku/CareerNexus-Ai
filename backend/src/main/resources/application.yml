server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: careernexus-api
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/careernexus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:careernexus}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  jwt:
    secret: ${JWT_SECRET:Y2FyZWVybmV4dXMtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    directory: ${UPLOAD_DIRECTORY:./uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
jobs:
  adzuna:
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    max-pages: ${ADZUNA_MAX_PAGES:5}
  greenhouse:
    boards: ${GREENHOUSE_BOARDS:}
  lever:
    boards: ${LEVER_BOARDS:}
recommendation:
  weights:
    required-skills: ${WEIGHT_REQUIRED_SKILLS:40}
    experience: ${WEIGHT_EXPERIENCE:25}
    location: ${WEIGHT_LOCATION:15}
    title: ${WEIGHT_TITLE:10}
    additional-skills: ${WEIGHT_ADDITIONAL_SKILLS:10}
logging:
  level:
    com.careernexus: INFO

